name: Process Approved Papers

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

jobs:
  process-papers:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'paper-review') &&
      startsWith(github.event.comment.body, '/approve ')
    runs-on: ubuntu-latest
    steps:
      - name: Require current repository write permission
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: context.payload.comment.user.login
            });
            if (!['admin', 'maintain', 'write'].includes(data.permission)) {
              core.setFailed('Only a current repository writer may approve a paper.');
            }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install PyYAML
      - name: Apply and commit one explicit approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "Paper Bot"
          git config user.email "paper-bot@users.noreply.github.com"
          # Every event gets a run; no concurrency group discards pending comments.
          # On a competing push, rebuild from the latest database and deduplicate.
          for attempt in 1 2 3 4 5; do
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
            python scripts/process_approved_papers.py --issue-number "$ISSUE_NUMBER"
            git add data/papers/papers.yaml
            if git diff --cached --quiet; then
              echo 'Paper already in collection; no change.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git commit -m "Approve one paper from issue #${ISSUE_NUMBER}"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              echo 'The explicitly selected paper was committed. Other papers remain pending.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo 'Could not commit approval after competing changes; rerun this failed job.' >&2
          exit 1
