research:
  - id: gaussian-medical-vision
    title: Gaussian Representations & 4D Medical Vision
    description: Continuous 3D Gaussian representations for cardiac motion tracking, sparse-view coronary reconstruction, and self-supervised learning from medical volumes.
  - id: generative-3d
    title: Generative 3D & Multiview Diffusion
    description: Diffusion-based 3D asset generation and medical image synthesis, with a focus on texture quality, multiview consistency, and coherent volumetric geometry.

experience:
  - period: Jul–Sep 2026
    role: Multimodal Generation Research Intern
    organization: Tencent Youtu Lab
    description: Studied single- and multi-view 3D asset generation, focusing on texture quality, multiview consistency, latent-space constraints, and geometry and texture editing.
  - period: Jul 2025–Jun 2026
    role: Research Project · Conditional 3D Medical Image Generation
    organization: Jiangsu Provincial Government Hospital
    description: Studied slice-consistent volumetric synthesis using conditional diffusion, correlated noise and sampling trajectories, and multiview fusion for coronary anatomy.
  - period: Oct 2021–Apr 2023
    role: Algorithm Research Intern
    organization: Tencent Youtu Tianyan Lab
    description: Developed cross-subject sEMG models for continuous knee-joint trajectory prediction and evaluated a real-time exoskeleton control loop.

