<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">最小 Agent 循环</title><desc id="desc">模型提出请求，运行器检查并调用工具，成功或失败的观察回到模型。被拒绝的请求不等于执行。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="420" rx="24" fill="#F8F7F2"/><g font-family="system-ui, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="40" y="43" text-anchor="start" font-size="23" font-weight="650" fill="#566B7D">AGENT LOOP · 动作由程序执行</text><rect x="35" y="105" width="190" height="105" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="130" y="150" text-anchor="middle" font-size="29" font-weight="700" fill="#18334B">模型</text><text x="130" y="186" text-anchor="middle" font-size="20" font-weight="500" fill="#566B7D">选择下一步</text><path d="M227 157 L264 157" fill="none" stroke="#127D83" stroke-width="4" marker-end="url(#arrow)"/><rect x="270" y="105" width="190" height="105" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="365" y="150" text-anchor="middle" font-size="29" font-weight="700" fill="#18334B">请求</text><text x="365" y="186" text-anchor="middle" font-size="20" font-weight="500" fill="#566B7D">声明动作与参数</text><path d="M462 157 L499 157" fill="none" stroke="#127D83" stroke-width="4" marker-end="url(#arrow)"/><rect x="505" y="105" width="190" height="105" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="600" y="150" text-anchor="middle" font-size="29" font-weight="700" fill="#18334B">运行器</text><text x="600" y="186" text-anchor="middle" font-size="20" font-weight="500" fill="#566B7D">校验与分派</text><path d="M697 157 L734 157" fill="none" stroke="#127D83" stroke-width="4" marker-end="url(#arrow)"/><rect x="740" y="105" width="190" height="105" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="835" y="150" text-anchor="middle" font-size="29" font-weight="700" fill="#18334B">工具</text><text x="835" y="186" text-anchor="middle" font-size="20" font-weight="500" fill="#566B7D">读取或改变状态</text><path d="M932 157 L969 157" fill="none" stroke="#127D83" stroke-width="4" marker-end="url(#arrow)"/><rect x="975" y="105" width="190" height="105" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="1070" y="150" text-anchor="middle" font-size="29" font-weight="700" fill="#18334B">观察</text><text x="1070" y="186" text-anchor="middle" font-size="20" font-weight="500" fill="#566B7D">成功 / 失败证据</text><path d="M1070 216 V320 H130 V217" fill="none" stroke="#127D83" stroke-width="4" marker-end="url(#arrow)"/><text x="590" y="354" text-anchor="middle" font-size="25" font-weight="500" fill="#127D83">把观察带回模型，再决定继续、调整或结束</text><path d="M600 210 V257 H785" fill="none" stroke="#B96A16" stroke-width="3" marker-end="url(#arrow)"/><text x="795" y="266" text-anchor="start" font-size="21" font-weight="500" fill="#B96A16">拒绝也必须留下结果</text></g></svg>