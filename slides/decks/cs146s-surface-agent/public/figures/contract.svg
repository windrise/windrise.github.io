<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">最小任务合同的五个方面</title><desc id="desc">目标、起点、保护、允许动作与验收证据让不同执行者理解同一个任务，缺失内容需明确标注。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="420" rx="24" fill="#F8F7F2"/><g font-family="system-ui, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="40" y="43" text-anchor="start" font-size="23" font-weight="650" fill="#566B7D">TASK CONTRACT · 把一句要求变成共同目标</text><rect x="35" y="100" width="190" height="204" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="130" y="149" text-anchor="middle" font-size="30" font-weight="700" fill="#127D83">目标</text><text x="130" y="211" text-anchor="middle" font-size="23" font-weight="500" fill="#18334B">改什么？</text><text x="130" y="257" text-anchor="middle" font-size="20" font-weight="500" fill="#566B7D">结果怎样算对？</text><rect x="270" y="100" width="190" height="204" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="365" y="149" text-anchor="middle" font-size="30" font-weight="700" fill="#127D83">起点</text><text x="365" y="211" text-anchor="middle" font-size="23" font-weight="500" fill="#18334B">哪份资产？</text><text x="365" y="257" text-anchor="middle" font-size="20" font-weight="500" fill="#566B7D">哪个父版本？</text><rect x="505" y="100" width="190" height="204" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="600" y="149" text-anchor="middle" font-size="30" font-weight="700" fill="#127D83">保护</text><text x="600" y="211" text-anchor="middle" font-size="23" font-weight="500" fill="#18334B">哪些不能变？</text><text x="600" y="257" text-anchor="middle" font-size="20" font-weight="500" fill="#566B7D">如何识别它们？</text><rect x="740" y="100" width="190" height="204" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="835" y="149" text-anchor="middle" font-size="30" font-weight="700" fill="#127D83">动作</text><text x="835" y="211" text-anchor="middle" font-size="23" font-weight="500" fill="#18334B">允许做什么？</text><text x="835" y="257" text-anchor="middle" font-size="20" font-weight="500" fill="#566B7D">何时需要确认？</text><rect x="975" y="100" width="190" height="204" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="1070" y="149" text-anchor="middle" font-size="30" font-weight="700" fill="#127D83">证据</text><text x="1070" y="211" text-anchor="middle" font-size="23" font-weight="500" fill="#18334B">检查什么？</text><text x="1070" y="257" text-anchor="middle" font-size="20" font-weight="500" fill="#566B7D">失败如何处理？</text><text x="600" y="365" text-anchor="middle" font-size="27" font-weight="650" fill="#B96A16">缺失项写“待确认”，不要自行发明阈值或权限。</text></g></svg>