<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">四层证据</title><desc id="desc">宣称、请求、执行、验收逐层增加可核验事实，但不能相互替代。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="420" rx="24" fill="#F8F7F2"/><g font-family="system-ui, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="40" y="43" text-anchor="start" font-size="23" font-weight="650" fill="#566B7D">EVIDENCE · 每层只支持自己的结论</text><rect x="35" y="85" width="245" height="238" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="61" y="121" text-anchor="start" font-size="20" font-weight="700" fill="#127D83">01</text><text x="157" y="169" text-anchor="middle" font-size="34" font-weight="700" fill="#18334B">宣称</text><text x="157" y="223" text-anchor="middle" font-size="24" font-weight="500" fill="#18334B">“我改好了”</text><text x="157" y="270" text-anchor="middle" font-size="20" font-weight="500" fill="#566B7D">一句待核实的话</text><path d="M287 200 L321 200" fill="none" stroke="#127D83" stroke-width="4" marker-end="url(#arrow)"/><rect x="330" y="85" width="245" height="238" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="356" y="121" text-anchor="start" font-size="20" font-weight="700" fill="#127D83">02</text><text x="452" y="169" text-anchor="middle" font-size="34" font-weight="700" fill="#18334B">请求</text><text x="452" y="223" text-anchor="middle" font-size="24" font-weight="500" fill="#18334B">要求编辑</text><text x="452" y="270" text-anchor="middle" font-size="20" font-weight="500" fill="#566B7D">可能尚未执行</text><path d="M582 200 L616 200" fill="none" stroke="#127D83" stroke-width="4" marker-end="url(#arrow)"/><rect x="625" y="85" width="245" height="238" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="651" y="121" text-anchor="start" font-size="20" font-weight="700" fill="#127D83">03</text><text x="747" y="169" text-anchor="middle" font-size="34" font-weight="700" fill="#18334B">执行</text><text x="747" y="223" text-anchor="middle" font-size="24" font-weight="500" fill="#18334B">动作有回执</text><text x="747" y="270" text-anchor="middle" font-size="20" font-weight="500" fill="#566B7D">版本与结果可查</text><path d="M877 200 L911 200" fill="none" stroke="#127D83" stroke-width="4" marker-end="url(#arrow)"/><rect x="920" y="85" width="245" height="238" rx="20" fill="#EAF5F1" stroke="#127D83" stroke-width="2"/><text x="946" y="121" text-anchor="start" font-size="20" font-weight="700" fill="#127D83">04</text><text x="1042" y="169" text-anchor="middle" font-size="34" font-weight="700" fill="#18334B">验收</text><text x="1042" y="223" text-anchor="middle" font-size="24" font-weight="500" fill="#18334B">目标有证据</text><text x="1042" y="270" text-anchor="middle" font-size="20" font-weight="500" fill="#566B7D">仍需核对适用范围</text><text x="600" y="377" text-anchor="middle" font-size="29" font-weight="650" fill="#B96A16">请求 ≠ 执行　　工具成功 ≠ 全部目标满足</text></g></svg>