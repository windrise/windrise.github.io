<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">文档、运行时、确定性检查和判断的职责</title><desc id="desc">说明文档描述要求；运行时控制实际动作；代码负责确定性检查；模型或人工负责语义判断。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="420" rx="24" fill="#F8F7F2"/><g font-family="system-ui, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="40" y="43" text-anchor="start" font-size="23" font-weight="650" fill="#566B7D">RESPONSIBILITY · 约束要放在能落实它的位置</text><rect x="35" y="95" width="245" height="225" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="157" y="148" text-anchor="middle" font-size="27" font-weight="700" fill="#127D83">说明文档</text><text x="157" y="209" text-anchor="middle" font-size="22" font-weight="500" fill="#18334B">解释目标与方法</text><text x="157" y="265" text-anchor="middle" font-size="19" font-weight="500" fill="#566B7D">告诉 Agent 应该怎么做</text><rect x="330" y="95" width="245" height="225" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="452" y="148" text-anchor="middle" font-size="27" font-weight="700" fill="#127D83">运行时边界</text><text x="452" y="209" text-anchor="middle" font-size="22" font-weight="500" fill="#18334B">允许 / 拒绝动作</text><text x="452" y="265" text-anchor="middle" font-size="19" font-weight="500" fill="#566B7D">决定工具实际能做什么</text><rect x="625" y="95" width="245" height="225" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="747" y="148" text-anchor="middle" font-size="27" font-weight="700" fill="#127D83">确定性检查</text><text x="747" y="209" text-anchor="middle" font-size="22" font-weight="500" fill="#18334B">数值、版本与规则</text><text x="747" y="265" text-anchor="middle" font-size="19" font-weight="500" fill="#566B7D">适合可精确定义的判据</text><rect x="920" y="95" width="245" height="225" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="1042" y="148" text-anchor="middle" font-size="27" font-weight="700" fill="#127D83">模型 / 人工</text><text x="1042" y="209" text-anchor="middle" font-size="22" font-weight="500" fill="#18334B">语义与证据充分性</text><text x="1042" y="265" text-anchor="middle" font-size="19" font-weight="500" fill="#566B7D">处理需判断的问题</text><text x="600" y="374" text-anchor="middle" font-size="27" font-weight="650" fill="#B96A16">文档、Skill 或 Hook 的名称，本身不是安全保证。</text></g></svg>