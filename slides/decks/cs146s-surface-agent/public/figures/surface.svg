<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">局部上色与保护区域</title><desc id="desc">抽象圆柱蓝色条带是编辑目标，其余表面是保护区域。示意不代表真实资产与验收门槛。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="420" rx="24" fill="#F8F7F2"/><g font-family="system-ui, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="40" y="43" text-anchor="start" font-size="23" font-weight="650" fill="#566B7D">SURFACE · 改目标区域，保留非目标区域</text><path d="M165 115 C165 70 495 70 495 115 V310 C495 355 165 355 165 310Z" fill="#E6EDE9" stroke="#718B91" stroke-width="3"/><ellipse cx="330" cy="115" rx="165" ry="35" fill="#F2F5F0" stroke="#718B91" stroke-width="3"/><path d="M165 190 Q330 240 495 190 V250 Q330 300 165 250Z" fill="#317CBE"/><path d="M165 190 Q330 240 495 190 M165 250 Q330 300 495 250" fill="none" stroke="#18578C" stroke-width="3"/><text x="330" y="384" text-anchor="middle" font-size="22" font-weight="500" fill="#566B7D">抽象圆柱 · 教学示意</text><path d="M500 223 L650 223" fill="none" stroke="#127D83" stroke-width="4" marker-end="url(#arrow)"/><rect x="685" y="86" width="460" height="95" rx="20" fill="#EFF6FC" stroke="#80A9CD" stroke-width="2"/><text x="710" y="124" text-anchor="start" font-size="26" font-weight="700" fill="#18578C">目标：蓝色条带</text><text x="710" y="158" text-anchor="start" font-size="21" font-weight="500" fill="#566B7D">身份和范围必须能够定位</text><rect x="685" y="204" width="460" height="95" rx="20" fill="#EDF5EE" stroke="#83A58B" stroke-width="2"/><text x="710" y="242" text-anchor="start" font-size="26" font-weight="700" fill="#326A45">保护：其余表面</text><text x="710" y="276" text-anchor="start" font-size="21" font-weight="500" fill="#566B7D">正面、背面及采样边缘都要考虑</text><text x="710" y="349" text-anchor="start" font-size="22" font-weight="500" fill="#B96A16">图示不定义真实资产或验收阈值</text></g></svg>