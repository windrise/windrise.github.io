<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">候选版本与验收绑定</title><desc id="desc">从父版本A生成候选B并验收B。之后修改成C，需要对应C的证据，不能沿用B的报告证明C通过。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="420" rx="24" fill="#F8F7F2"/><g font-family="system-ui, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="40" y="43" text-anchor="start" font-size="23" font-weight="650" fill="#566B7D">VERSION BINDING · 报告跟着版本走</text><rect x="35" y="92" width="245" height="115" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="157" y="140" text-anchor="middle" font-size="29" font-weight="700" fill="#18334B">A · 父版本</text><text x="157" y="178" text-anchor="middle" font-size="21" font-weight="500" fill="#566B7D">确定起点</text><rect x="330" y="92" width="245" height="115" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="452" y="140" text-anchor="middle" font-size="29" font-weight="700" fill="#18334B">B · 候选</text><text x="452" y="178" text-anchor="middle" font-size="21" font-weight="500" fill="#566B7D">执行编辑</text><rect x="625" y="92" width="245" height="115" rx="20" fill="#FFFFFF" stroke="#C8D7DF" stroke-width="2"/><text x="747" y="140" text-anchor="middle" font-size="29" font-weight="700" fill="#18334B">B · 验收</text><text x="747" y="178" text-anchor="middle" font-size="21" font-weight="500" fill="#566B7D">检查同一个 B</text><path d="M285 149 L320 149" fill="none" stroke="#127D83" stroke-width="4" marker-end="url(#arrow)"/><path d="M580 149 L615 149" fill="none" stroke="#127D83" stroke-width="4" marker-end="url(#arrow)"/><path d="M452 214 V289 H615" stroke="#127D83" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="625" y="245" width="245" height="115" rx="20" fill="#FFF3E3" stroke="#D8AB6F" stroke-width="2"/><text x="747" y="292" text-anchor="middle" font-size="29" font-weight="700" fill="#B96A16">C · 再修改</text><text x="747" y="330" text-anchor="middle" font-size="21" font-weight="500" fill="#566B7D">需要自己的证据</text><text x="1005" y="145" text-anchor="middle" font-size="25" font-weight="700" fill="#127D83">可接受 B</text><text x="1005" y="286" text-anchor="middle" font-size="24" font-weight="500" fill="#B96A16">B 的报告</text><text x="1005" y="324" text-anchor="middle" font-size="24" font-weight="700" fill="#B96A16">不能替 C 背书</text><text x="40" y="391" text-anchor="start" font-size="22" font-weight="500" fill="#566B7D">同一目标，还要核对同一输入、同一候选与同一检查范围。</text></g></svg>