<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文阅读 · wind × Rise</title><meta name="description" content="有出处的论文阅读、研究问题与同源汇报。"><link rel="stylesheet" href="./reading.css"></head>
<body><a class="skip-link" href="#article-container">跳到正文</a>
<header class="desk-header"><div class="header-inner"><div class="header-brand"><strong>wind × Rise / READING</strong><a href="https://wind-rise-projects.fuxueming595.chatgpt.site/#project/rise-research-workbench/overview">科研工作台 ↗</a><a href="https://windrise.github.io/slides/">演示目录 ↗</a></div><p class="desk-subtitle">读论文，留下有出处的判断。</p><div class="header-controls"><input id="search-input" class="search-input" type="search" placeholder="搜索标题、作者、arXiv" aria-label="搜索文献"><details id="filter-details" class="filter-disclosure" open><summary>筛选</summary><div class="filter-row"><select id="topic-select" class="filter-select" aria-label="筛选专题"><option value="">全部专题</option></select><select id="year-select" class="filter-select" aria-label="筛选年份"><option value="">全部年份</option></select><select id="filter-select" class="filter-select" aria-label="筛选内容状态"><option value="all">全部内容</option><option value="deep_dive">深读初稿</option><option value="metadata_only">仅元信息</option></select><button id="reset-filters" class="btn btn-sm" type="button">重置</button></div></details></div><p id="results-summary" role="status" class="text-muted"></p></div></header>
<main class="desk-workspace"><aside class="sidebar-panel"><details id="library-navigation" open><summary>论文库与目录</summary><ul id="paper-list" class="paper-list"></ul><nav aria-label="章节目录"><div class="panel-title">本篇目录</div><ul id="toc-list" class="toc-list"></ul></nav></details></aside><article class="reading-article-card" id="article-card"><div id="article-container" tabindex="-1"></div></article><aside class="inspector-panel"><section><h2 class="panel-title">原文证据</h2><div id="evidence-list"></div></section><section id="local-notes" class="notes-container" hidden><h2 class="panel-title">我的阅读</h2><p class="notes-tip">仅保存在当前本机浏览器；不上传，不跨设备同步。清理浏览器前请备份。</p><label for="reading-status">阅读状态</label><select id="reading-status" class="filter-select"><option value="">未设置</option><option value="to_read">待读</option><option value="reading">阅读中</option><option value="read">已读</option></select><label for="note-section">笔记位置</label><select id="note-section" class="filter-select"></select><label for="notes-textarea">私人笔记</label><textarea id="notes-textarea" class="notes-textarea" placeholder="疑问、启发或下次阅读要核对的地方"></textarea><div class="notes-actions"><button id="save-notes-btn" class="btn btn-primary btn-sm" type="button">保存</button><button id="export-notes-btn" class="btn btn-sm" type="button">备份 JSON</button><label class="btn btn-sm file-restore">恢复备份<input id="import-notes-file" type="file" accept=".json"></label></div><p id="notes-toast" role="status" aria-live="polite"></p></section><section class="export-panel"><h2 class="panel-title">阅读成果</h2><div id="export-links-list" class="export-links-list"></div></section><p class="snapshot-note">公开内容快照 · 来源核对与个人阅读分开记录。</p></aside></main><script src="./reading.js"></script></body></html>
